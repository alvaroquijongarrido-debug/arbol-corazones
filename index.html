<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>San Valentín</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#ff4d88, #990033);
  overflow: hidden;
  color: #333;
}

.contenedor {
  background: #f5e6d8;
  width: 90%;
  max-width: 600px;
  margin: 40px auto;
  padding: 20px;
  border-radius: 10px;
  text-align: left;
  position: relative;
}

.arbol {
  position: relative;
  width: 200px;
  height: 200px;
  margin: auto;
}

.tronco {
  width: 20px;
  height: 80px;
  background: #8b5a2b;
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
}

.corazon {
  position: absolute;
  color: red;
  font-size: 20px;
  animation: flotar 4s linear infinite;
}

@keyframes flotar {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
}

.contador {
  font-size: 20px;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="contenedor">
  <p>Para el amor de mi vida:</p>
  <br>

  <div class="arbol" id="arbol">
    <div class="tronco"></div>
  </div>

  <p>Mi amor por ti comenzó hace...</p>
  <div class="contador" id="contador"></div>
</div>

<script>
/* FECHA INICIO (CAMBIA ESTA FECHA) */
const fechaInicio = new Date("2025-02-14T00:00:00");

function actualizarContador() {
  const ahora = new Date();
  const diff = ahora - fechaInicio;

  const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
  const horas = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutos = Math.floor((diff / (1000 * 60)) % 60);
  const segundos = Math.floor((diff / 1000) % 60);

  document.getElementById("contador").innerHTML =
    dias + " días " +
    horas + " horas " +
    minutos + " minutos " +
    segundos + " segundos";
}

setInterval(actualizarContador, 1000);

/* GENERAR CORAZONES */
function crearCorazon() {
  const arbol = document.getElementById("arbol");
  const corazon = document.createElement("div");
  corazon.className = "corazon";
  corazon.innerHTML = "❤";

  corazon.style.left = Math.random() * 180 + "px";
  corazon.style.bottom = "60px";

  arbol.appendChild(corazon);

  setTimeout(() => {
    corazon.remove();
  }, 4000);
}

setInterval(crearCorazon, 300);
</script>

</body>
</html>
